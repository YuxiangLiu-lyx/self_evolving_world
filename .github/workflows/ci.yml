name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Install pinned dependencies
        run: pnpm install --frozen-lockfile
      - name: Derive checks from actual changes
        id: plan
        run: pnpm exec tsx scripts/validation-plan-cli.ts ${{ github.event_name == 'workflow_dispatch' && '--audit' || '' }}
      - name: Install Chromium and system dependencies
        if: steps.plan.outputs.browser == 'true'
        run: pnpm exec playwright install --with-deps chromium
      - name: Validate code, browser behavior and documentation
        run: pnpm validate -- ${{ github.event_name == 'workflow_dispatch' && '--audit' || '' }} "CI automated validation"
      - name: Retain validation evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: validation-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            playwright-report/
            test-results/
            validation-results/
            !validation-results/receipt-key
          retention-days: 14
          if-no-files-found: warn
